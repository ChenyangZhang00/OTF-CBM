[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otf-cbm"
version = "0.1.0"
description = "Optimal-Transport Flow Concept Bottleneck Models"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["otf_cbm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
